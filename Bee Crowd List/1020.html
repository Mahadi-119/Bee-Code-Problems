<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
   var input = `400`;
   var lines = input.split('\n');
   let myInput= lines[0];
   const totalYear = (old) =>{
    let oldYear =  Math.trunc( old / 365);
    old = old % 365;

    let oldMonth = Math.trunc( old / 30);
    old = old % 30;

    const totalDay = old;

    return {
      oldYear,
      oldMonth,
      totalDay
    }
   }
  
   const idea = totalYear(myInput);
   console.log (` ${idea.oldYear} ano(s)`)
   console.log (` ${idea.oldMonth} mes(es)`)
   console.log (` ${idea.totalDay} dia(s)`) 
  </script>
</body>
</html>
