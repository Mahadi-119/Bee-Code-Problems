<body>
    <script>
        
      var input = `3`;
      console.log(typeof(input));
      var lines = input.split('\n');
      console.log(typeof(lines));
      console.log(lines);
      let [parseA] = lines ;
      let R = Number(parseA);
      let sqar = R * R * R;
      let divaid = (4/3);
      let pi = 3.14159;
      let total = divaid * pi * sqar;
      console.log(typeof(total));
      console.log(`TOTAL = R$ ${total.toFixed(3)}`);
    </script>
